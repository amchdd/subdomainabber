name: Integração contínua do Go

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verificar módulos
        run: go mod verify
      - name: Validar workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Verificar formatação
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Os seguintes arquivos precisam de gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Análise com vet
        run: go vet ./...
      - name: Análise estática
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Verificar vulnerabilidades alcançáveis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Testes
        run: go test ./... -count=1
      - name: Validar assinaturas embarcadas
        run: go run . fingerprints validate --strict
      - name: Detector de condições de corrida
        run: go test -race ./... -count=1

  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Compilar
        run: go build ./...
